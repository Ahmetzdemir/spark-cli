[project]
name = "spark-cli"
version = "0.1.0"
description = "Yerel AI kodlama asistanı — 4B parametreli modellerle çalışan Claude Code alternatifi"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ahmet"},
]

dependencies = [
    "openai>=1.40.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
    "gitpython>=3.1.0",
    "tiktoken>=0.7.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["duckduckgo-search>=6.0.0"]
all = ["duckduckgo-search>=6.0.0"]

[project.scripts]
spark = "spark.cli:main"
claude = "spark.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spark*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
